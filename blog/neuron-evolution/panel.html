<body>
<title>Pythia Neuron Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：左栏挑选神经元（地图 + 分组 + 列表），右栏看一个神经元的 AI 总结、曲线、逐 step 解释和原文；窄屏堆成一列 */
:root {
  --surface-0: #f4f4f2; --surface-1: #fcfcfb; --surface-2: #f0efec; --border: #e2e1dc;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #85847f;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100; --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948; --series-other: #a8a7a0;
  --dot-muted: #cfcec8; --accent: #2a78d6; --on-accent: #ffffff; --hl: 42, 120, 214; --hit: #0b0b0b; --sel-row: #e6f0fb;
  --shadow: rgba(0, 0, 0, .18);
  --font-ui: -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #242422; --border: #33332f;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767; --series-other: #6b6a63;
    --dot-muted: #45443f; --accent: #3987e5; --on-accent: #ffffff; --hl: 57, 135, 229; --hit: #f0efec; --sel-row: #1d2b3d;
    --shadow: rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #242422; --border: #33332f;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767; --series-other: #6b6a63;
  --dot-muted: #45443f; --accent: #3987e5; --on-accent: #ffffff; --hl: 57, 135, 229; --hit: #f0efec; --sel-row: #1d2b3d;
  --shadow: rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-0); color: var(--text-primary); font: 14px/1.55 var(--font-ui); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface-1); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface-1); border-bottom: 1px solid var(--border);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.brand { display: inline-flex; align-items: center; gap: 8px; margin-right: 8px; }
.brand .logo { width: 24px; height: 24px; flex: none; display: block; }
header h1 { font-size: 16px; margin: 0; text-wrap: balance; }
.ctl { color: var(--text-secondary); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
select, input, button { font: inherit; color: var(--text-primary); background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; max-width: 100%; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, .group:focus-visible, .nrow:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.langs { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.hlinks { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-left: auto; }
.hbtn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; line-height: 1.4; padding: 3px 11px; border: 1px solid var(--border); border-radius: 999px;
  background: var(--surface-1); color: var(--text-primary); text-decoration: none; cursor: pointer; white-space: nowrap; }
.hbtn:hover { background: var(--surface-2); border-color: var(--text-muted); }
.hbtn svg { width: 15px; height: 15px; fill: currentColor; flex: none; }
.hbtn .q { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 11px; font-weight: 700; }
#guidebox { width: min(520px, calc(100% - 32px)); max-height: calc(100vh - 48px); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px 14px;
  background: var(--surface-1); color: var(--text-primary); box-shadow: 0 8px 30px var(--shadow); }
#guidebox::backdrop { background: rgba(0, 0, 0, .35); }
#guidebox h2 { font-size: 16px; margin: 0 0 4px; }
#guidebox ol { list-style: none; counter-reset: g; padding: 0; margin: 8px 0; }
#guidebox li { counter-increment: g; display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; margin: 10px 0; font-size: 13px; color: var(--text-secondary); }
#guidebox li::before { content: counter(g); display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--surface-2); color: var(--text-primary); font-size: 12px; font-weight: 600; }
#guidebox li b { color: var(--text-primary); }
#guidebox .gfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--text-muted); }
.langs button { border: 0; border-radius: 0; padding: 3px 10px; background: var(--surface-1); }
.langs button.on { background: var(--accent); color: var(--on-accent); }
.panel-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel-head h2 { margin-right: auto; }
.panel-head .langs { margin-left: 0; font-size: 12px; }
.layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 14px; align-items: start;
  padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.layout > * { min-width: 0; }
#left { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); max-height: calc(100vh - 78px); overflow: auto; }
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  #left { position: static; max-height: none; }
  #nlist { max-height: 360px; overflow: auto; }
}
.panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; min-width: 0; }
.panel h2 { font-size: 14px; margin: 0 0 6px; text-wrap: balance; }
.muted { color: var(--text-muted); }
.small { font-size: 12px; }
.sec { color: var(--text-secondary); }
#map { width: 100%; height: auto; aspect-ratio: 36 / 26; max-width: 100%; display: block; }
.group { padding: 6px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
.group:hover { background: var(--surface-2); }
.group.active { border-color: var(--accent); background: var(--sel-row); }
.group .gname { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 13px; }
.group .gdesc { font-size: 12px; color: var(--text-secondary); }
.bar { height: 4px; border-radius: 2px; background: var(--series-1); margin-top: 3px; }
.nrow { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 6px; padding: 4px 6px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.nrow:hover { background: var(--surface-2); }
.nrow.sel { background: var(--sel-row); }
.nrow .nid { font-variant-numeric: tabular-nums; font-weight: 600; }
.chip { display: inline-block; background: var(--surface-2); border-radius: 999px; padding: 0 8px; font-size: 12px;
  color: var(--text-secondary); margin: 1px 4px 1px 0; }
.chip b { color: var(--text-primary); font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 14px; }
.card h3 { margin: 0 0 6px; font-size: 14px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 10px; font-size: 13px; margin: 6px 0; }
.kv div:nth-child(odd) { color: var(--text-muted); }
.chain { border-left: 2px solid var(--border); margin: 6px 0 0 4px; padding-left: 10px; font-size: 13px; }
.chain div { margin-bottom: 4px; }
.chain .st { font-variant-numeric: tabular-nums; color: var(--text-muted); margin-right: 4px; }
details summary { cursor: pointer; color: var(--text-secondary); font-size: 12px; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 14px; }
.chart svg { width: 100%; height: 190px; display: block; overflow: visible; }
svg text { fill: var(--text-muted); font-size: 11px; }
.chart .ttl { font-size: 13px; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--text-secondary); margin: 2px 0 4px; }
.legend span { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.scroll-x { overflow-x: auto; max-width: 100%; }
table.evo { width: 100%; min-width: 640px; border-collapse: collapse; font-size: 13px; }
table.evo th { text-align: left; color: var(--text-muted); font-weight: 500; font-size: 12px; border-bottom: 1px solid var(--border); padding: 4px 6px; }
table.evo td { border-bottom: 1px solid var(--border); padding: 5px 6px; vertical-align: top; }
table.evo tr { cursor: pointer; }
table.evo tbody tr:hover td { background: var(--surface-2); }
table.evo tr.sel td { background: var(--sel-row); }
table.evo td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.detbar { display: inline-block; height: 8px; border-radius: 2px; background: var(--series-1); vertical-align: middle; margin-right: 4px; }
.mechtbl { border-collapse: collapse; font-size: 12px; margin-top: 6px; }
.mechtbl td, .mechtbl th { padding: 2px 6px; border-bottom: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; }
.mechtbl th:first-child, .mechtbl td:first-child { text-align: left; white-space: nowrap; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.lin { font-size: 13px; margin: 3px 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 14px; }
.cols > * { min-width: 0; }
.pat { font-size: 13px; margin: 3px 0; }
.pat code { background: var(--surface-2); border-radius: 4px; padding: 0 4px; font-size: 12px; font-family: var(--font-mono); word-break: break-word; }
.ctx { border-top: 1px solid var(--border); padding: 8px 0; }
.ctx .meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 2px; }
.ctx .meta b { color: var(--text-primary); }
.text { white-space: pre-wrap; word-break: break-word; font: 13px/1.75 var(--font-mono); }
.text span.t { border-radius: 3px; }
.text span.hit { outline: 2px solid var(--hit); font-weight: 700; }
.text .nl { color: var(--text-muted); }
#tip { position: fixed; z-index: 50; pointer-events: none; display: none; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12px; box-shadow: 0 2px 10px var(--shadow); max-width: 320px; }
.empty { padding: 40px 16px; text-align: center; color: var(--text-muted); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
#c-tree.focus .lin { opacity: .15; }
.timebar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.timebar input[type=range] { flex: 1 1 auto; min-width: 0; accent-color: var(--accent); }
.timebar .lbl { font-size: 12px; color: var(--text-secondary); font-variant-numeric: tabular-nums; min-width: 6.5em; text-align: right; }
.subttl { font-size: 12px; color: var(--text-secondary); margin: 10px 0 2px; }
#c-tree.focus .lin.on { opacity: 1; }
#c-tree .lin.dim { opacity: .12; }
.legend button { font-size: 12px; padding: 1px 8px; }
.about { font-size: 13px; color: var(--text-secondary); max-width: 72ch; }
/* 嵌入模式（?embed）：只留一个神经元的演化图和原文，供博客用 iframe 嵌入 */
body.embed { background: var(--surface-1); }
body.embed header, body.embed #left { display: none; }
body.embed .layout { display: block; padding: 0; }
body.embed .panel { border: 0; border-radius: 0; margin: 0; padding: 12px 16px; }
body.embed .panel + .panel, body.embed details.panel { border-top: 1px solid var(--border); }
body.embed #stepcols { max-height: 440px; overflow: auto; overscroll-behavior: contain; }
body.embed .treebox { max-height: 460px; overflow: auto; overscroll-behavior: contain; }
body.embed details.panel > summary { font-size: 13px; padding: 2px 0; }
.embhead { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; }
.embhead .hbtn { margin-left: auto; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<script>
const $ = id => document.getElementById(id);
const Q = new URLSearchParams(location.search), EMBED = Q.has("embed");

const T = {
  zh: {

const MECH = [["branch", "var(--series-2)"], ["coexist", "var(--series-3)"], ["replace", "var(--series-4)"],

const MECH_COLOR = Object.fromEntries(MECH);
// 系列：沿“派生自”一路追到根概念；根概念按整个训练过程的激活占比排序，前 8 个各用一种颜色，其余为灰色

function families(n) {

  for (const g0 of n.lineages) {
    if (!g0.birth) continue;
    let g = g0;
    const seen = new Set();
    while (g.birth === "branch" && byId[g.birth_parent] && !seen.has(g.id)) { seen.add(g.id); g = byId[g.birth_parent]; }
    rootOf[g0.id] = g.id;
  }
  for (const sh of n.lineage_shares) for (const id in sh) if (rootOf[id]) tot[rootOf[id]] = (tot[rootOf[id]] || 0) + sh[id];
  const roots = [...new Set(Object.values(rootOf))].sort((a, b) => (tot[b] || 0) - (tot[a] || 0));

const focusKey = n => !S.famFocus ? null : (families(n).slot[S.famFocus] >= 0 ? S.famFocus : "_other");

const arrowKey = (n, g) => S.colorBy !== "family" ? g.birth : (famSlot(n, g.id) >= 0 ? "f" + famSlot(n, g.id) : "fo");
// 条形图、图例和数据表共用的系列：按机制时是各机制，按系列时是最大的几个系列 + 其他 + 未解释
function barSeries(n) {
  if (S.colorBy !== "family") return MECH.map(([m, c]) => ({ key: m, label: E("mech", m), color: c, vals: n.mech[m] }));

    .concat([{ key: "_other", label: t("famOther"), color: "var(--series-other)", vals: vals("_other") },

async function loadSim() {

    }
    // 存活期：连续出现为实线，中间断开为虚线
    for (let j = g.first; j < g.last; j++) {
      const on = g.pres[j] > 0 && g.pres[j + 1] > 0;
      parts.push(on
        ? `<path d="M${X(j)},${y} L${X(j + 1)},${y}" stroke="${c}" stroke-width="${width(g, (g.pres[j] + g.pres[j + 1]) / 2)}" stroke-linecap="round"/>`
        : `<path d="M${X(j)},${y} L${X(j + 1)},${y}" stroke="${c}" stroke-width="1.2" stroke-dasharray="2 4" opacity=".7"/>`);
    }
    // 消失：被替换的由接替者在同一条线上继续；其他画一小段淡出的直线；活到最后的延伸到右边缘
    if (g.last === k - 1) {
      parts.push(`<path d="M${X(k - 1)},${y} L${W - 2},${y}" stroke="${c}" stroke-width="${width(g, g.pres[k - 1])}"/>`);
    } else if (!replacedBy[g.id]) {
      parts.push(`<path d="M${X(g.last)},${y} L${X(g.last) + dx * 0.5},${y}" stroke="${c}" stroke-width="${width(g, g.pres[g.last])}" stroke-linecap="round" opacity=".35"/>`);
    }
    g.pres.forEach((v, j) => { if (v > 0) parts.push(`<circle cx="${X(j)}" cy="${y}" r="${2 + 2.5 * Math.min(1, v)}" fill="${c}" stroke="var(--surface-1)" stroke-width="1.5"/>`); });
    const x0 = g.first > 0 ? X(g.first - 1) : 0, x1 = g.last === k - 1 ? W : X(g.last) + dx * 0.5;
    parts.push(`<path d="M${x0},${y} L${x1},${y}" stroke="transparent" stroke-width="12" pointer-events="stroke"/>`);
    h += `<g class="${linCls(g)}" data-g="${esc(g.id)}" style="cursor:pointer">${parts.join("")}</g>`;
  }
  // 零散：最下面一条淡线，每个零散特征画成从外面进入的短箭头
  if (sporadic.length) {
    h += `<line x1="${X(0)}" x2="${X(k - 1)}" y1="${spY}" y2="${spY}" stroke="var(--border)" stroke-width="1"/>`;
    for (const g of sporadic) {
      const c = color(g), j = g.first;
      h += `<g class="${linCls(g)}" data-g="${esc(g.id)}" style="cursor:pointer">${enter(X(j), spY, c, arrowKey(n, g))}
        <circle cx="${X(j)}" cy="${spY}" r="${2 + 2.5 * Math.min(1, g.pres[j])}" fill="${c}" stroke="var(--surface-1)" stroke-width="1.5"/>
        <path d="M${X(j) - dx},${spY} L${X(j) + 4},${spY}" stroke="transparent" stroke-width="10" pointer-events="stroke"/></g>`;
    }
  }
  svg.innerHTML = h;
  const nameOf = id => { const i = n.lineages.findIndex(x => x.id === id); return i >= 0 ? Li(n, "lineages", i, "name") : id; };
  const info = id => {
    const g = byId[id], i = n.lineages.findIndex(x => x.id === id);
    const span = g.first === g.last ? t("treeOnce")(num(steps[g.first]))
      : g.last === k - 1 ? t("treeOngoing")(num(steps[g.first])) : t("treeSpan")(num(steps[g.first]), num(steps[g.last]));
    const how = Li(n, "lineages", i, "how");
    return `<b>${esc(nameOf(id))}</b>${g.core ? ` · ${t("coreTag")}` : ""}<br><span class="muted">${esc(E("mech", g.birth))} · ${span}</span>`
      + (g.birth === "branch" ? `<br>${t("treeFrom")(esc(nameOf(g.birth_parent)))}` : "")
      + (S.colorBy === "family" && families(n).rootOf[id] !== id ? `<br>${t("treeFam")(esc(nameOf(families(n).rootOf[id])))}` : "")
      + (g.birth === "replace" && g.replaces ? `<br>${t("treeReplaces")(esc(nameOf(g.replaces)))}` : "")
      + (how ? `<br>${esc(how)}` : "");
  };
  if (S.pin && byId[S.pin]) {  // 博客指定高亮的概念：常亮并显示说明，鼠标移入后恢复正常
    const g = byId[S.pin], el = svg.querySelector(`g.lin[data-g="${CSS.escape(S.pin)}"]`), r = svg.getBoundingClientRect(), sc = r.width / W;
    svg.classList.add("focus"); el.classList.add("on");
    const y = g.birth === "sporadic" ? spY : yOf(laneOf[g.id]);
    requestAnimationFrame(() => tip({ clientX: r.left + X(g.first) * sc, clientY: r.top + y * sc + 6 }, info(S.pin)));
  }
  svg.onmousemove = ev => {
    if (S.pin) { S.pin = null; }
    const el = ev.target.closest("g.lin");
    svg.classList.toggle("focus", !!el && !S.famFocus);
    for (const x of svg.querySelectorAll("g.lin")) x.classList.toggle("on", x === el);
    tip(ev, el ? info(el.dataset.g) : null);
  };
  svg.onmouseleave = ev => { svg.classList.remove("focus"); tip(ev, null); };
  svg.onclick = ev => {
    const el = ev.target.closest("g.lin");
    if (el) {  // 点击一条线：只看它所在的系列；再点同一系列恢复
      const r = families(n).rootOf[el.dataset.g];
      S.famFocus = S.famFocus === r ? null : r;
      return renderCharts();
    }
    const col = ev.target.closest("rect[data-col]");
    if (col) setStep(steps[+col.dataset.col]);
  };
}
function moveStep(d) {
  const i = S.rows.findIndex(r => r.step === S.step);
  setStep(S.rows[Math.max(0, Math.min(S.rows.length - 1, i + d))].step);
}
function setStep(s) { S.step = s; renderEvo(); renderCharts(); renderStep(); }
function renderEvo() {
  const loss = Object.fromEntries(S.meta.steps.map((s, i) => [s, S.meta.loss[i]]));
  $("evo").innerHTML = S.rows.map(r => `<tr class="${r.step === S.step ? "sel" : ""}" data-s="${r.step}" tabindex="0">
    <td class="num">${num(r.step)}</td><td class="num">${loss[r.step]?.toFixed(2) ?? ""}</td>
    <td class="num">${r.det == null ? "—" : `<span class="detbar" style="width:${Math.max(0, (r.det - 0.5) * 2) * 40}px"></span>${r.det.toFixed(2)}`}</td>
    <td class="num">${r.clarity ?? ""}</td><td>${esc(L(r, "concept"))}</td><td class="sec">${esc(L(r, "description"))}</td></tr>`).join("");
  for (const tr of $("evo").querySelectorAll("tr")) {
    tr.onclick = () => setStep(+tr.dataset.s);
    tr.onkeydown = e => { if (e.key === "Enter") setStep(+tr.dataset.s); };
  }
}

// ---------- 图 ----------
function mechChart(n) {
  const svg = $("c-mech");
  if (!svg || !n.mech) return;
  const W = svg.clientWidth || 600, H = 150, pl = 14, pr = 14, pt = 4, pb = 20, steps = S.meta.steps, k = steps.length;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const colW = (W - pl - pr) / (k - 1), X = j => pl + j * colW, bw = Math.min(colW * 0.7, 28);
  const Y = v => pt + (H - pt - pb) * (1 - v);
  const ser = barSeries(n), fk = S.colorBy === "family" ? focusKey(n) : null;
  let h = `<line x1="${pl - bw / 2}" x2="${W - pr + bw / 2}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--border)"/>`;
  const every = colW < 26 ? 4 : 2;
  steps.forEach((s, i) => {
    let acc = 0;
    for (const x of ser) {
      const v = x.vals[i];
      if (v <= 0) continue;
      h += `<rect x="${X(i) - bw / 2}" y="${Y(acc + v)}" width="${bw}" height="${Math.max(0, Y(acc) - Y(acc + v))}" fill="${x.color}" stroke="var(--surface-1)" stroke-width="2"${fk && x.key !== fk ? ' opacity=".15"' : ""}/>`;
      acc += v;
    }
    if (s === S.step) h += `<rect x="${X(i) - bw / 2 - 3}" y="${pt - 2}" width="${bw + 6}" height="${H - pt - pb + 4}" fill="none" stroke="var(--text-primary)" stroke-width="1.5" stroke-dasharray="3 2" rx="3"/>`;
    if (i % every === 0 || i === k - 1) h += `<text x="${X(i)}" y="${H - 5}" text-anchor="middle">${fmtAxis(s)}</text>`;
  });
  h += steps.map((s, i) => `<rect x="${X(i) - colW / 2}" y="${pt}" width="${colW}" height="${H - pt - pb}" fill="transparent" data-i="${i}"/>`).join("");
  svg.innerHTML = h;
  svg.onmousemove = ev => {
    const r = ev.target.closest("rect[data-i]");
    if (!r) return tip(ev, null);
    const i = +r.dataset.i;
    tip(ev, `<b>${fmtStep(steps[i])}</b><br>` + ser.filter(x => x.vals[i] > 0).map(x => `${esc(x.label)}: ${Math.round(x.vals[i] * 100)}%`).join("<br>"));
  };
  svg.onmouseleave = ev => tip(ev, null);
  svg.onclick = ev => { const r = ev.target.closest("rect[data-i]"); if (r) setStep(steps[+r.dataset.i]); };
}
function renderCharts() {
  const n = S.meta.neurons.find(x => x.id === S.sel);
  if (!n || !n.lineages || !n.lineages.length) return;
  paintEvoText(n);
  treeChart(n);
  mechChart(n);
}

// ---------- 某个 step 的实际激活 ----------
function ctxHTML(c, i, top1) {
  let h = "";
  c.tokens.forEach((tok, j) => {
    const a = c.a[j], alpha = a > 0 ? Math.min(a, 100) / 100 * 0.8 : 0;
    let txt = esc(tok).replace(/\n/g, '<span class="nl">↵</span>\n');
    if (txt === "") txt = "​";
    h += `<span class="t${j === c.hit ? " hit" : ""}" data-a="${a}" data-v="${(a / 100 * top1).toFixed(2)}" style="background:rgba(var(--hl),${alpha.toFixed(2)})">${txt}</span>`;
  });
  return `<div class="ctx"><div class="meta"><span><b>[${i + 1}]</b></span><span>${t("act")} <b>${c.value.toFixed(2)}</b></span>
    <span class="chip">${esc(c.subset)}</span><span>${t("doc")} ${c.doc} · ${t("pos")} ${c.pos}</span></div><div class="text">${h}</div></div>`;
}
function stepCol(r) {
  const n = S.meta.neurons.find(x => x.id === S.sel);
  const linOf = id => (n.lineages || []).findIndex(g => g.id === id);
  const pats = r.patterns.map((p, pi) => {
    const gi = linOf(p.lineage), g = gi >= 0 ? n.lineages[gi] : null;
    const pe = S.lang === "en" && r.en && r.en.patterns && r.en.patterns[pi] ? r.en.patterns[pi] : p;
    return `<div class="pat">${g ? `<span class="chip" title="${esc(Li(n, "lineages", gi, "name"))}"><i class="swatch" style="background:${linColor(n, g)}"></i>${esc(E("mech", g.birth))}</span>` : ""}<b>${esc(pe.name || p.name)}</b> <code>${esc(p.trigger)}</code>
      <span class="muted">${t("seg")} ${(p.segments || []).map(x => "[" + x + "]").join("")}</span>
      <div class="small sec">${esc([pe.context || p.context, pe.domain || p.domain].filter(Boolean).join("; "))}</div></div>`;
  }).join("");
  const un = r.unexplained && r.unexplained.length ? t("unexplained")(r.unexplained.map(x => "[" + x + "]").join("")).replace(/^ · /, "") : "";
  return `<div><h2>${fmtStep(r.step)}　<span class="sec" style="font-weight:400">${esc(L(r, "concept"))}</span></h2>
    <div class="small">${esc(L(r, "description"))}</div>
    ${un ? `<div class="small muted" style="margin:4px 0">${un}</div>` : ""}
    <details ${S.cmp == null ? "open" : ""}><summary>${t("patterns")(r.patterns.length)}</summary>${pats}</details>
    ${r.contexts.slice(0, S.topn).map((c, i) => ctxHTML(c, i, r.top1)).join("")}</div>`;
}
function renderStep() {
  const r = S.rows.find(x => x.step === S.step), c = S.cmp != null ? S.rows.find(x => x.step === S.cmp) : null;
  $("stephdr").textContent = t("actual")(num(S.step), c ? num(c.step) : null);
  $("stepcols").innerHTML = stepCol(r) + (c ? stepCol(c) : "");
}
document.addEventListener("mousemove", ev => {
  const el = ev.target.closest && ev.target.closest(".text span.t");
  if (!el) { if (ev.target.closest && ev.target.closest(".text")) tip(ev, null); return; }
  tip(ev, `${esc(JSON.stringify(el.textContent.replace(/↵/g, "")))}　${t("tipAct")(el.dataset.v, el.dataset.a)}`);
});
document.addEventListener("keydown", ev => {
  if (!S.rows || ["INPUT", "SELECT", "TEXTAREA"].includes(ev.target.tagName)) return;
  if (ev.key === "ArrowLeft") moveStep(-1);
  if (ev.key === "ArrowRight") moveStep(1);
});

// ---------- 启动 ----------
(async () => {
  try { if (localStorage.getItem("explorer-colorby") === "family") S.colorBy = "family"; } catch (e) { /* 存储不可用 */ }
  if (EMBED) {
    document.body.classList.add("embed");
    if (["mech", "family"].includes(Q.get("color"))) S.colorBy = Q.get("color");
    addEventListener("message", e => {
      const d = e.data || {};
      if (d.type === "nevo-lang" && d.lang !== S.lang) setLang(d.lang);
      if (d.type === "nevo-select" && d.neuron && d.neuron !== S.sel) { S.pin = null; select(d.neuron).then(() => parent.postMessage({ type: "nevo-ready", id: Q.get("id") }, "*")); }
      if (d.type === "nevo-pin" && S.rows) {
        if (d.color && d.color !== S.colorBy) S.colorBy = d.color;
        S.pin = d.lineage || null; S.famFocus = null;
        if (d.step != null && S.rows.some(r => r.step === d.step)) setStep(d.step); else renderCharts();
      }
    });
    new ResizeObserver(() => parent.postMessage({ type: "nevo-h", id: Q.get("id"), h: document.documentElement.scrollHeight }, "*")).observe(document.body);
  }
  $("lang-zh").onclick = () => setLang("zh");
  $("lang-en").onclick = () => setLang("en");
  $("guide").onclick = () => $("guidebox").showModal();
  $("guide-close").onclick = () => $("guidebox").close();
  $("guidebox").onclick = e => {
    const r = $("guidebox").getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) $("guidebox").close();
  };
  setLang(EMBED && Q.get("lang") === "zh" ? "zh" : "en");  // 每次打开都从英文开始（嵌入时跟随博客）
  S.meta = await (await fetch("data/meta.json")).json();
  $("grouping").onchange = () => { S.grouping = $("grouping").value; S.group = null; renderLeft(); };
  $("search").oninput = e => { S.query = e.target.value; renderList(); renderMap(); };
  $("mapstep").max = String(S.meta.steps.length - 1);
  S.mapIdx = S.meta.steps.length - 1;
  $("mapstep").oninput = e => setMapIdx(+e.target.value);
  $("mapplay").onclick = togglePlay;
  bindMap();
  setLang(S.lang);
  // 链接里的 #L6-N201 打开对应神经元；没有就默认打开一个有代表性的递归泛化例子
  const m = /^#?L(\d+)-N(\d+)$/.exec(location.hash || "");
  const first = m ? `${m[1]}_${m[2]}` : (S.meta.neurons.find(n => n.id === "9_2943") || S.meta.neurons[0]).id;
  await select(first, Q.has("step") ? +Q.get("step") : undefined);
  if (EMBED) parent.postMessage({ type: "nevo-ready", id: Q.get("id") }, "*");
  addEventListener("resize", () => { if (S.rows) renderCharts(); });
})();
</script>
